name: kontrola

on:
  push:
  pull_request:

jobs:
  tajemstvi:
    name: sken tajemstvi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  markdown:
    name: kontrola odkazu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: rozbite odkazy v md
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --offline '**/*.md'
          fail: true

